<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventaris Laboratorium</title>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --primary:#2563eb; --danger:#dc2626; --border:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    header { background:var(--primary); color:#fff; padding:20px 24px; }
    header h1 { margin:0; font-size:1.4rem; }
    header p { margin:4px 0 0; opacity:.85; font-size:.9rem; }
    main { max-width:900px; margin:24px auto; padding:0 16px; display:grid; gap:20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
    form { display:grid; grid-template-columns: 2fr 1.2fr .8fr 1fr auto; gap:10px; align-items:end; }
    label { font-size:.75rem; color:var(--muted); display:block; margin-bottom:4px; }
    input, select { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:.9rem; }
    button { padding:9px 16px; border:0; border-radius:8px; background:var(--primary); color:#fff; cursor:pointer; font-size:.9rem; }
    button.del { background:var(--danger); padding:6px 12px; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-weight:600; font-size:.75rem; text-transform:uppercase; }
    .badge { padding:2px 10px; border-radius:999px; font-size:.75rem; }
    .Tersedia { background:#dcfce7; color:#166534; }
    .Dipinjam { background:#fef3c7; color:#92400e; }
    .Rusak { background:#fee2e2; color:#991b1b; }
    #msg { font-size:.85rem; min-height:1.2em; margin-top:8px; }
    .empty { text-align:center; color:var(--muted); padding:20px; }
    @media (max-width:720px){ form { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Inventaris Barang Laboratorium</h1>
    <p>Katalog alat lab: Mikrotik, Modem, Kabel, dan lainnya</p>
  </header>
  <main>
    <section class="card">
      <form id="form">
        <div><label for="name">Nama alat</label><input id="name" required placeholder="Mikrotik RB951"></div>
        <div><label for="category">Kategori</label><input id="category" placeholder="Router"></div>
        <div><label for="quantity">Jumlah</label><input id="quantity" type="number" min="1" value="1" required></div>
        <div><label for="status">Status</label>
          <select id="status"><option>Tersedia</option><option>Dipinjam</option><option>Rusak</option></select></div>
        <button type="submit">Tambah</button>
      </form>
      <div id="msg"></div>
    </section>

    <section class="card">
      <table>
        <thead><tr><th>#</th><th>Nama</th><th>Kategori</th><th>Jml</th><th>Status</th><th>Ditambahkan</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="total" style="margin-top:10px;color:var(--muted);font-size:.85rem"></div>
    </section>
  </main>

  <script>
  const API = "/api/inventory";
  const rows = document.getElementById("rows");
  const msg = document.getElementById("msg");

  function show(text, ok = true) {
    msg.textContent = text;
    msg.style.color = ok ? "#166534" : "#991b1b";
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  async function readJson(res) {
    try { return await res.json(); }
    catch { return { error: "Backend tidak tersedia (HTTP " + res.status + ")" }; }
  }

  async function load() {
    try {
      const res = await fetch(API);
      const data = await readJson(res);
      if (!res.ok) throw new Error(data.error);
      rows.innerHTML = data.items.length
        ? data.items.map((it, i) => `
          <tr>
            <td>${i}</td><td>${esc(it.name)}</td><td>${esc(it.category)}</td>
            <td>${it.quantity}</td>
            <td><span class="badge ${esc(it.status)}">${esc(it.status)}</span></td>
            <td>${esc(it.added_at)}</td>
            <td><button class="del" onclick="removeItem(${i})">Hapus</button></td>
          </tr>`).join("")
        : '<tr><td colspan="7" class="empty">Belum ada data alat</td></tr>';
      document.getElementById("total").textContent = "Total entri: " + data.total;
    } catch (e) {
      rows.innerHTML = '<tr><td colspan="7" class="empty">Backend tidak tersedia</td></tr>';
      document.getElementById("total").textContent = "";
      show("Gagal terhubung ke backend", false);
    }
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
      name: document.getElementById("name").value,
      category: document.getElementById("category").value,
      quantity: Number(document.getElementById("quantity").value),
      status: document.getElementById("status").value,
    };
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await readJson(res);
      if (res.ok) { show(data.message); e.target.reset(); document.getElementById("quantity").value = 1; }
      else show(data.error, false);
    } catch (err) {
      show("Gagal mengirim data: backend tidak terhubung", false);
    }
    load();
  });

  async function removeItem(index) {
    if (!confirm("Hapus alat ini?")) return;
    try {
      const res = await fetch(`${API}?index=${index}`, { method: "DELETE" });
      const data = await readJson(res);
      show(res.ok ? data.message : data.error, res.ok);
    } catch (err) {
      show("Gagal menghapus: backend tidak terhubung", false);
    }
    load();
  }

  load();
  setInterval(load, 5000);
</script>
