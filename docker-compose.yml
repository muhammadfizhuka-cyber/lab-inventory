services:
  backend:
    build: ./backend
    container_name: lab-backend
    environment:
      DATA_DIR: /var/lib/backend_data
    volumes:
      - lab-inventory-data:/var/lib/backend_data   # Named Volume (data persisten)
    networks:
      - app-net
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: lab-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro             # Bind Mount (UI live tanpa rebuild)
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  lab-inventory-data:

networks:
  app-net:
    driver: bridge
